system:
  num_workers: 1
  calculate_per_token_loss: true
  tensor_model_parallel_size: 2 # note: related-to num_query_groups and num_attention_heads
  # unset pp_size, recursive transformer do not support balanced pipeline stages
  pipeline_model_parallel_size: 1
  context_parallel_size: 1
  expert_model_parallel_size: 4
  # use_flash_attn: True # deprecated, use ```attention_backend: flash```
  use_distributed_optimizer: True
  sequence_parallel: True
  tp_comm_overlap: False # rely on TE support and custom hardware
  overlap_grad_reduce: True # overlap all-reduce with backward propagation
  overlap_param_gather: True # overlap parameter gather with computation
  # use_mcore_models: True # deprecated, mcore models are default
  transformer_impl: transformer_engine
  # use_te: True # deprecated, use ```transformer_impl: transformer_engine```
  precision:
    bf16: True
    attention_softmax_in_fp32: True
    accumulate_allreduce_grads_in_fp32: True
  logging:
    # timing_log_level: 2
    log_interval: 1
    log_throughput: true
    log_params_norm: true
    log_num_zeros_in_grad: true
    wandb_project: qwen36-35b-a3b-fsa-grad-norm-analysis
    wandb_exp_name: no_loop_exp1
    wandb_mode: online
    wandb_api_key: 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
  # memory:
  #   record_memory_history: True
  #   memory_snapshot_path: /share/project/lixianduo/memory_logs/memory_snapshot_16k_cold.pickle
  checkpoint:
    save_interval: 200
    ckpt_format: torch
    load: /share/project/lixianduo/models/MG-TP2-EP4-Qwen3.6-35B-A3B

model:
  finetune: true # for resume
  # attention_backend: flash
  attention_backend: fsa
  # Qwen3.6-35B-A3B (MoE) architecture parameters
  kv_channels: 256
  qk_layernorm: True
  disable_bias_linear: True
  num_layers: 40
  hidden_size: 2048
  num_attention_heads: 16
  num_query_groups: 2
  ## sequence length
  seq_length: 32768
  max_padding_length: 32768
  # enable_variable_seq_lengths: True ## disabled, to avoid rebundant pp communication overhead
  max_position_embeddings: 262144 # max length for qwen3.6 rope
  swiglu: True
  normalization: RMSNorm
  norm_epsilon: 1e-6
  init_method_std: 6e-3
  attention_dropout: 0.0
  hidden_dropout: 0.0
  clip_grad: 1.0
  group_query_attention: True
  no_masked_softmax_fusion: True
  untie_embeddings_and_output_weights: True
  
  # # Position embedding: rope for text model
  # position_embedding_type: rope
  # use_rotary_position_embeddings: true
  # rotary_percent: 0.25                    # keep consistent with mrope for qwen3.6
  # rotary_base: 1000000                    # keep consistent with mrope for qwen3.6
  # rotary_seq_len_interpolation_factor: 1
  # no_rope_fusion: True


  # Position embedding: Qwen3.5 uses mRoPE with partial rotary
  position_embedding_type: mrope
  rotary_percent: 0.25
  rotary_base: 1000000
  rotary_seq_len_interpolation_factor: 1
  no_rope_fusion: False
  mrope_section: [11, 11, 10]
  eod_mask_loss: False
  # no_position_embedding: true # deprecated for newest megatron, use 'position_embedding_type' instead

  # # mtp
  # mtp_num_layers: 1

  recompute:
    recompute_granularity: 'full'
    recompute_method: 'uniform'
    recompute_num_layers: 1
    mtp_recompute_num_layers: 1 # decoupled llm and mtp recompute num layers, only support mtp_num_recompute_layers=1


  no_check_for_nan_in_loss_and_grad: true
  seed: 233 # to be checked

  # Gated DeltaNet (GDN) parameters
  experimental_attention_variant: gated_delta_net
  linear_attention_freq: 4
  linear_conv_kernel_dim: 4
  linear_key_head_dim: 128
  linear_value_head_dim: 128
  linear_num_key_heads: 16
  linear_num_value_heads: 32
  layernorm_zero_centered_gamma: True
  attention_output_gate: True

  # MoE parameters
  num_experts: 256
  moe_router_topk: 8
  moe_ffn_hidden_size: 512
  moe_shared_expert_gate: True
  moe_shared_expert_intermediate_size: 512
  moe_router_dtype: fp32
  moe_router_load_balancing_type: global_aux_loss
  moe_router_pre_softmax: False
  moe_grouped_gemm: True
  # moe_token_dispatcher_type: alltoall # configed in following
  moe_permute_fusion: True
  moe_aux_loss_coeff: 1.0e-3

  # training configs
  micro_batch_size: 1
  global_batch_size: 256
  eval_iters: 0
  eval_interval: 1000
  train_samples: 2097152

  optimizer:
    optimizer: adam
    loss_scale: 1.0
    weight_decay: 0.1
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    lr_scheduler:
      lr: 1.0e-5
      min_lr: 1.0e-6 # not used, for lr_decay_style: constant
      lr_warmup_samples: 0 # 512 iterations, 256 gbs
      lr_decay_style: constant
    
  ###### vision related args ######
  no_enable_vision: True  # generates --no-enable-vision; remove this line for multimodal training
  ###### vision related args ######


  ## chunked cross-entropy ##
  chunked_cross_entropy: True
  # cross_entropy_chunk_size: 4096
  cross_entropy_chunk_size: 1024  # optional, default to 4096
  ## chunked cross-entropy ##


  ## performance optimizations ###
  # 1. base: TP4EP2, full recompute, triton fsa. Perf: mem-60GB, comp-31.4
  
  # 2. fused zigzag transpose. Perf: mem-60GB, comp-31.3
  # fsa_use_fused_kernels: True

  # 3. deepep. Perf: mem-65GB, comp-55.6
  # moe_token_dispatcher_type: alltoall
  moe_token_dispatcher_type: flex
  moe_flex_dispatcher_backend: deepep
  # moe_deepep_num_sms: 20
  moe_deepep_num_sms: 100

  # 4. fsa cuda kernels
  fsa_use_cuda: True
  ## performance optimizations ##

  
  # ## Loop Transformer (SMELT recipe): loop middle 50% layers twice, scale 1/r
  # loop_start_layer: 16       # 0-based global index, inclusive
  # loop_end_layer: 36         # 0-based global index, exclusive
  # num_loop_iterations: 2     # loop twice → effective depth: 60 layers
  # # loop_residual_scale: 0.5   # 1/r = 1/2, applied to all sublayer residuals in loop span
  # loop_residual_scale: [0.7, 0.3]
  # loop_type: block-wise
  # loop_block_size: 4
  # ## Loop Transformer

  log_per_module_grad_norm: true
  log_per_module_grad_norm_detailed: true

  gdn_spike_diag_threshold: 0


