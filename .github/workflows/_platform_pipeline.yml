# Reusable per-platform pipeline for FlagScale CI:
#   prepare_dependencies → all_tests_common → Feishu notification.
# Called from ci.yml with a platform matrix so each platform runs independently.

name: Platform Pipeline

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
        description: Platform identifier (must match a .github/configs/*.yml stem)
    secrets:
      FEISHU_WEBHOOK:
        required: false

jobs:
  prepare:
    name: prepare / ${{ inputs.platform }}
    uses: ./.github/workflows/prepare_dependencies.yml
    with:
      platform: ${{ inputs.platform }}

  test:
    name: test / ${{ inputs.platform }}
    needs: prepare
    uses: ./.github/workflows/all_tests_common.yml
    with:
      platform: ${{ inputs.platform }}
      megatron_cache_key: ${{ needs.prepare.outputs.megatron_cache_key }}
      megatron_artifact_available: ${{ needs.prepare.outputs.megatron_artifact_available }}
      te_fl_cache_key: ${{ needs.prepare.outputs.te_fl_cache_key }}
      te_fl_artifact_available: ${{ needs.prepare.outputs.te_fl_artifact_available }}

  # Derive overall_result from whichever stage failed first so the Feishu card
  # accurately reflects prepare failures (test.result would be 'skipped').
  overall:
    name: compute-result / ${{ inputs.platform }}
    if: always()
    needs: [prepare, test]
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.r.outputs.result }}
    steps:
      - id: r
        run: |
          prep="${{ needs.prepare.result }}"
          test="${{ needs.test.result }}"
          if [[ "$prep" != "success" ]]; then
            echo "result=$prep" >> "$GITHUB_OUTPUT"
          else
            echo "result=$test" >> "$GITHUB_OUTPUT"
          fi

  notify:
    name: notify / ${{ inputs.platform }}
    if: always()
    needs: [prepare, test, overall]
    uses: ./.github/workflows/_feishu_notify.yml
    with:
      platform: ${{ inputs.platform }}
      overall_result: ${{ needs.overall.outputs.result }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
