# Unified CI entry point for FlagScale.
#
# Pipeline:  lint → generate-matrix → platform-pipeline (matrix)
#
# Platform discovery is config-driven: generate_matrix.py scans
# .github/configs/*.yml for platform names, then on pull_request events
# intersects the changed-file list against per-platform paths_watch so
# only affected platforms run.  All other events run the full matrix.

name: CI

on:
  schedule:
    - cron: '0 18 * * *'   # 02:00 CST daily
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'examples/**'
  pull_request:
    branches: [main, devops]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'examples/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install linters
        run: pip install --quiet ruff typos
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: typos
        run: typos

  generate-matrix:
    name: Generate platform matrix
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute platform matrix
        id: matrix
        run: |
          python .github/scripts/ci/generate_matrix.py \
            --event-name "${{ github.event_name }}" \
            --base-ref  "${{ github.base_ref || 'main' }}" \
            --configs-dir .github/configs \
            >> "$GITHUB_OUTPUT"

  platform-pipeline:
    name: Platform pipeline (${{ matrix.platform }})
    needs: generate-matrix
    if: needs.generate-matrix.outputs.platforms != '[]'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.generate-matrix.outputs.platforms) }}
    uses: ./.github/workflows/_platform_pipeline.yml
    with:
      platform: ${{ matrix.platform }}
