# One required check, with config-driven per-platform pipelines.
name: CI

on:
  schedule:
    - cron: '0 18 * * *'   # 02:00 Asia/Shanghai daily
  push:
    branches: [main]
  pull_request:
    branches: [main, devops]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CI validation dependencies
        run: pip install --quiet pre-commit==4.2.0 PyYAML==6.0.2 pytest==8.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test CI comment authorization
        run: node --test tests/ci/slash_command.test.cjs
      - name: Test CI control logic (no accelerators required)
        run: python -m pytest --confcutdir=tests/ci tests/ci -q
      - name: pre-commit (changed files)
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          pre-commit run --show-diff-on-failure \
            --from-ref "$(git merge-base "$BASE_REF" HEAD)" --to-ref HEAD

  generate-matrix:
    name: Generate platform matrix
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet PyYAML==6.0.2
      - name: Compute platform matrix
        id: matrix
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python .github/scripts/ci/generate_matrix.py \
            --event-name "$GITHUB_EVENT_NAME" \
            --base-ref "$BASE_REF" --head-ref "$HEAD_REF" \
            --event-path "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"
      - name: Explain selection
        env:
          PLATFORMS: ${{ steps.matrix.outputs.platforms }}
          REASON: ${{ steps.matrix.outputs.reason }}
        run: |
          printf 'Platforms: `%s`\n\nReason: %s\n' "$PLATFORMS" "$REASON" >> "$GITHUB_STEP_SUMMARY"

  platform-pipeline:
    name: Platform pipeline (${{ matrix.platform }})
    needs: generate-matrix
    if: needs.generate-matrix.outputs.platforms != '[]'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.generate-matrix.outputs.platforms) }}
    uses: ./.github/workflows/_platform_pipeline.yml
    with:
      platform: ${{ matrix.platform }}

  ci-complete:
    name: CI Complete
    needs: [lint, generate-matrix, platform-pipeline]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify required checks
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          PLATFORMS: ${{ needs.generate-matrix.outputs.platforms || '[]' }}
        run: python3 .github/scripts/ci/check_results.py
