name: Failure Analysis and Auto-Retry Flaky Tests

on:
  workflow_run:
    workflows: [CI, all_tests]
    types: [completed]

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: ci-auto-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Privileged workflow_run: use trusted default-branch policy only.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts/ci
          persist-credentials: false
      - name: Fetch failed job logs and classify
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-retry-logs"
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/1/jobs?per_page=100" \
            --jq '.jobs' | jq -s 'add' > "$RUNNER_TEMP/ci-jobs.json"
          while read -r job_id; do
            # Missing/unavailable logs leave an empty file and cannot justify retry.
            gh run view "$RUN_ID" --job "$job_id" --log-failed \
              > "$RUNNER_TEMP/ci-retry-logs/$job_id.log" || :
          done < <(jq -r '.[] | select(.conclusion == "failure") | .id' "$RUNNER_TEMP/ci-jobs.json")
          python3 .github/scripts/ci/retry_policy.py \
            --jobs "$RUNNER_TEMP/ci-jobs.json" --logs-dir "$RUNNER_TEMP/ci-retry-logs" >> "$GITHUB_OUTPUT"
      - name: Check that PR still points to this commit
        id: current
        if: steps.policy.outputs.retry == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.event !== 'pull_request') {
              core.setOutput('current', 'true');
              return;
            }
            let prs = run.pull_requests;
            if (!prs.length) {
              prs = (await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...context.repo, commit_sha: run.head_sha
              })).data;
            }
            let current = false;
            for (const item of prs) {
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: item.number });
              if (pr.state === 'open' && pr.head.sha === run.head_sha) current = true;
            }
            core.setOutput('current', String(current));
      - name: Re-run failed jobs once
        if: steps.policy.outputs.retry == 'true' && steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # A human may already have re-run the workflow while logs were read.
          attempt=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '.run_attempt')
          if [ "$attempt" = 1 ]; then
            gh run rerun "$RUN_ID" --failed
          fi
