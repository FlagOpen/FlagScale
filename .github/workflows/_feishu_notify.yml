# Reusable workflow: post per-platform CI status to a Feishu group bot.
#
# Callers must forward the FEISHU_WEBHOOK secret.  If the secret is absent
# or empty the step is silently skipped so repos without a webhook configured
# do not fail CI.
#
# Result strings follow the GitHub Actions job-result vocabulary:
#   success | failure | cancelled | skipped

name: Feishu Notification

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
        description: Platform identifier (e.g. cuda, ascend, hygon)
      repo:
        required: false
        type: string
        default: ""
        description: Repository full name override (defaults to github.repository)
      ref:
        required: false
        type: string
        default: ""
        description: Git ref that triggered the run
      run_url:
        required: true
        type: string
        description: Direct URL to the GitHub Actions run
      lint_result:
        required: false
        type: string
        default: "skipped"
      unit_result:
        required: false
        type: string
        default: "skipped"
      functional_result:
        required: false
        type: string
        default: "skipped"
      integration_result:
        required: false
        type: string
        default: "skipped"
      overall_result:
        required: true
        type: string
        description: "Aggregated result: success | failure | cancelled"
    secrets:
      FEISHU_WEBHOOK:
        required: false

jobs:
  notify:
    name: notify / ${{ inputs.platform }}
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build and post Feishu card
        if: ${{ secrets.FEISHU_WEBHOOK != '' }}
        env:
          WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          PLATFORM: ${{ inputs.platform }}
          REPO: ${{ inputs.repo || github.repository }}
          REF: ${{ inputs.ref || github.ref }}
          RUN_URL: ${{ inputs.run_url }}
          LINT: ${{ inputs.lint_result }}
          UNIT: ${{ inputs.unit_result }}
          FUNCTIONAL: ${{ inputs.functional_result }}
          INTEGRATION: ${{ inputs.integration_result }}
          OVERALL: ${{ inputs.overall_result }}
        run: |
          set -euo pipefail

          # Map result string to emoji + label.
          result_icon() {
            case "$1" in
              success)   echo "✅ success"   ;;
              failure)   echo "❌ failure"   ;;
              cancelled) echo "⚠️ cancelled" ;;
              skipped)   echo "⏭ skipped"   ;;
              *)         echo "❓ $1"        ;;
            esac
          }

          OVERALL_ICON=$(result_icon "$OVERALL")
          LINT_ICON=$(result_icon "$LINT")
          UNIT_ICON=$(result_icon "$UNIT")
          FUNCTIONAL_ICON=$(result_icon "$FUNCTIONAL")
          INTEGRATION_ICON=$(result_icon "$INTEGRATION")

          # Shorten ref for display (refs/heads/main → main).
          SHORT_REF="${REF#refs/heads/}"
          SHORT_REF="${SHORT_REF#refs/pull/}"

          PAYLOAD=$(jq -n \
            --arg overall  "$OVERALL_ICON" \
            --arg platform "$PLATFORM" \
            --arg repo     "$REPO" \
            --arg ref      "$SHORT_REF" \
            --arg url      "$RUN_URL" \
            --arg lint     "$LINT_ICON" \
            --arg unit     "$UNIT_ICON" \
            --arg func     "$FUNCTIONAL_ICON" \
            --arg integ    "$INTEGRATION_ICON" \
            '{
              msg_type: "interactive",
              card: {
                header: {
                  title: { tag: "plain_text", content: ("CI " + $overall + " · " + $platform) },
                  template: (if $overall == "✅ success" then "green" elif $overall == "❌ failure" then "red" else "orange" end)
                },
                elements: [
                  {
                    tag: "div",
                    fields: [
                      { is_short: true,  text: { tag: "lark_md", content: ("**Repo**\n" + $repo) } },
                      { is_short: true,  text: { tag: "lark_md", content: ("**Ref**\n" + $ref) } },
                      { is_short: true,  text: { tag: "lark_md", content: ("**Lint**\n" + $lint) } },
                      { is_short: true,  text: { tag: "lark_md", content: ("**Unit**\n" + $unit) } },
                      { is_short: true,  text: { tag: "lark_md", content: ("**Functional**\n" + $func) } },
                      { is_short: true,  text: { tag: "lark_md", content: ("**Integration**\n" + $integ) } }
                    ]
                  },
                  {
                    tag: "action",
                    actions: [
                      { tag: "button", text: { tag: "plain_text", content: "View Run" }, url: $url, type: "default" }
                    ]
                  }
                ]
              }
            }')

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$WEBHOOK")

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::warning::Feishu webhook returned HTTP $HTTP_CODE — notification may not have been delivered"
          fi
